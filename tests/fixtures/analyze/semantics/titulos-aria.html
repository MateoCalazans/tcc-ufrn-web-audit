<!doctype html>
<html lang="pt-BR"><head><title>títulos ARIA</title></head>
<body>
  <div role="heading" aria-level="1">nível 1 por ARIA</div>
  <div role="heading">sem aria-level: nível 2</div>
  <h2 aria-level="4">h2 com aria-level 4: nível 4 (salto)</h2>
  <h3 role="presentation">não é título</h3>
  <h6 aria-level="abc">aria-level inválido: nível 6 (salto)</h6>
  <section hidden><h1>oculto: não conta</h1></section>
  <svg><text>h1</text></svg>
</body></html>
