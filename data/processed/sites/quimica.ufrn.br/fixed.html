		const URL_DO_WEB_APP = "https://script.google.com/macros/s/AKfycbw9HViZo5nhx1qhFB0EcyyC2PMW_GthJ2-hhkgHxIOn8o25k4RYLCHH8aASkYxfuoW1/exec"

		document.getElementById('formManutecao').addEventListener('submit', function (e) {
			e.preventDefault();

			const dados = {
				nome: document.getElementById('nome').value,
				email: document.getElementById('email').value,
				mensagem: document.getElementById('mensagem').value
			};

			fetch(URL_DO_WEB_APP, {
				method: 'POST',
				body: JSON.stringify(dados)
			})
				.then(resposta => resposta.text())
				.then(dados => {
					alert("E-mail enviado com sucesso!");
					document.getElementById('formManutecao').reset();
				})
				.catch(erro => console.error('Erro:', erro));
		});

	</script>
