quot;:291022,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-10-14T12:15:54.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-10-14T12:16:04.000000Z&quot;}],&quot;primary_image&quot;:{&quot;uuid&quot;:&quot;394fdd0a-6553-47e6-899e-626c95f6b79b&quot;,&quot;name&quot;:&quot;epl4pahey0td4pLR62dcKO4aC4yebUeETEcEqlmH.png&quot;,&quot;original_name&quot;:&quot;Captura de tela de 2026-10-14 09-14-43.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/Review\/e44bef09-2805-4770-9066-d483ae08a869\/general\/epl4pahey0td4pLR62dcKO4aC4yebUeETEcEqlmH.png&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:291022,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-10-14T12:15:54.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-10-14T12:16:04.000000Z&quot;},&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:false},&quot;categories&quot;:[],&quot;created_at&quot;:&quot;2026-08-05T17:19:58.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:19:58.000000Z&quot;},{&quot;uuid&quot;:&quot;0d93c3d1-cd76-40dd-8ec4-442af9fb295d&quot;,&quot;slug&quot;:&quot;armorial-50-anos-exposicao&quot;,&quot;title&quot;:&quot;Armorial 50 anos&quot;,&quot;date&quot;:&quot;2025-05-23&quot;,&quot;authors&quot;:[{&quot;uuid&quot;:&quot;73e9ff73-fe55-4a79-8f1a-00d38d92c8a0&quot;,&quot;slug&quot;:&quot;fabiola-alves&quot;,&quot;name&quot;:&quot;Fab\u00edola Alves&quot;,&quot;date_of_birth&quot;:&quot;1986-02-14&quot;,&quot;date_of_death&quot;:null,&quot;content&quot;:&quot;&lt;p&gt;Natural de Gua&amp;iacute;ra (PR), vive no Nordeste brasileiro desde 2018 e atualmente reside em Natal (RN).&amp;nbsp; Desde 2020 &amp;eacute; professora da Universidade Federal do Rio Grande do Norte (DEART-UFRN). &amp;Eacute; membro a Associa&amp;ccedil;&amp;atilde;o Brasileira de Cr&amp;iacute;ticos de Arte (ABCA) e coordenadora do Programa de P&amp;oacute;s-gradua&amp;ccedil;&amp;atilde;o em Artes Visuais da (PPGAV-UFRN).&amp;nbsp;&lt;\/p&gt;&quot;,&quot;chronology&quot;:&quot;&lt;p&gt;2008: Licenciatura plena em Educa&amp;ccedil;&amp;atilde;o Art&amp;iacute;stica - Desenho pela Universidade Federal do Paran&amp;aacute; (UFPR).&lt;\/p&gt;\n&lt;p&gt;2013: Mestrado Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), bolsa FAPESP.&lt;\/p&gt;\n&lt;p&gt;2016: Doutorado em Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), com est&amp;aacute;gio de doutorado na Universidade Paris 1 Panth&amp;eacute;on-Sorbonne, percurso em Cr&amp;iacute;tica de Arte, bolsa PNDS CAPES.&lt;\/p&gt;\n&lt;p&gt;2018: P&amp;oacute;s-Doutorado em Hist&amp;oacute;ria da Arte pela Universidade Federal de S&amp;atilde;o Paulo (UNIFESP)&lt;\/p&gt;&quot;,&quot;images&quot;:[],&quot;primary_image&quot;:null,&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:true},&quot;periods&quot;:[],&quot;genders&quot;:[],&quot;cities&quot;:[],&quot;awards&quot;:[],&quot;links&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/lattes.cnpq.br\/6838453885637422\&quot;&gt;http:\/\/lattes.cnpq.br\/6838453885637422&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-08-04T13:31:59.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:03:33.000000Z&quot;}],&quot;content&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span lang=\&quot;pt\&quot; xml:lang=\&quot;pt\&quot;&gt;&lt;em&gt;Armorial 50&lt;\/em&gt;. 2024. Exposi&amp;ccedil;&amp;atilde;o patente no Museu de Arte da Bahia, Salvador, entre 23 de julho e 20 de outubro de 2024; Pinacoteca Potiguar, Natal, entre 31 de outubro de 2024 a 26 de janeiro de 2025; e Espa&amp;ccedil;o Cultural Unifor, Fortaleza, de 12 de fevereiro a 30 de junho de 2025, Brasil. Curadoria de Denise Mattar.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span lang=\&quot;pt\&quot; xml:lang=\&quot;pt\&quot;&gt;A exposi&amp;ccedil;&amp;atilde;o &lt;\/span&gt;&lt;em&gt;&lt;span lang=\&quot;pt\&quot; xml:lang=\&quot;pt\&quot;&gt;Armorial 50&lt;\/span&gt;&lt;\/em&gt;&lt;span lang=\&quot;pt\&quot; xml:lang=\&quot;pt\&quot;&gt; celebra o quinquag&amp;eacute;simo anivers&amp;aacute;rio do movimento liderado pelo brasileiro Ariano Suassuna (1927-2014), dramaturgo paraibano. Foi apresentada ao p&amp;uacute;blico entre 2024 e 2025, nas principais metr&amp;oacute;poles do Sudeste do Brasil, S&amp;atilde;o Paulo, Rio de Janeiro e Belo Horizonte (Minas Gerais); tamb&amp;eacute;m foi visitada na capital do pa&amp;iacute;s, em Bras&amp;iacute;lia; e para terminar a sua itiner&amp;acirc;ncia, foi levada ao Nordeste, &amp;agrave;s cidades de Campina Grande (Para&amp;iacute;ba), Recife (Pernambuco), Salvador (Bahia), Natal (Rio Grande do Norte) e Fortaleza (Cear&amp;aacute;). A exposi&amp;ccedil;&amp;atilde;o &amp;eacute; assinada pela curadora carioca Denise Mattar. Ela contou com a consultoria de Manuel Dantas Suassuna, artista e filho de Ariano Suassuna e do professor universit&amp;aacute;rio, Carlos Newton J&amp;uacute;nior, investigador e especialista no tema da mostra. A exposi&amp;ccedil;&amp;atilde;o foi patrocinada pela Petrobras atrav&amp;eacute;s da Lei Federal de Incentivo &amp;agrave; Cultura, importante via de investimento na promo&amp;ccedil;&amp;atilde;o da cultura prevista na legisla&amp;ccedil;&amp;atilde;o brasileira.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span lang=\&quot;pt\&quot; xml:lang=\&quot;pt\&quot;&gt;Para ler o texto completo, acesse:&amp;nbsp;&lt;a href=\&quot;https:\/\/journals.openedition.org\/midas\/6269\&quot; target=\&quot;New Tab\&quot;&gt;https:\/\/journals.openedition.org\/midas\/6269&lt;\/a&gt;&amp;nbsp t&quot;:&quot;2026-08-05T17:23:34.000000Z&quot;},{&quot;uuid&quot;:&quot;3716ad1b-f17e-43f0-a3a4-da60b30ef023&quot;,&quot;slug&quot;:&quot;maria-do-santissimo-por-muito-tempo&quot;,&quot;title&quot;:&quot;Maria do Sant\u00edssimo, por muito tempo ...&quot;,&quot;date&quot;:&quot;2025-04-28&quot;,&quot;authors&quot;:[{&quot;uuid&quot;:&quot;73e9ff73-fe55-4a79-8f1a-00d38d92c8a0&quot;,&quot;slug&quot;:&quot;fabiola-alves&quot;,&quot;name&quot;:&quot;Fab\u00edola Alves&quot;,&quot;date_of_birth&quot;:&quot;1986-02-14&quot;,&quot;date_of_death&quot;:null,&quot;content&quot;:&quot;&lt;p&gt;Natural de Gua&amp;iacute;ra (PR), vive no Nordeste brasileiro desde 2018 e atualmente reside em Natal (RN).&amp;nbsp; Desde 2020 &amp;eacute; professora da Universidade Federal do Rio Grande do Norte (DEART-UFRN). &amp;Eacute; membro a Associa&amp;ccedil;&amp;atilde;o Brasileira de Cr&amp;iacute;ticos de Arte (ABCA) e coordenadora do Programa de P&amp;oacute;s-gradua&amp;ccedil;&amp;atilde;o em Artes Visuais da (PPGAV-UFRN).&amp;nbsp;&lt;\/p&gt;&quot;,&quot;chronology&quot;:&quot;&lt;p&gt;2008: Licenciatura plena em Educa&amp;ccedil;&amp;atilde;o Art&amp;iacute;stica - Desenho pela Universidade Federal do Paran&amp;aacute; (UFPR).&lt;\/p&gt;\n&lt;p&gt;2013: Mestrado Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), bolsa FAPESP.&lt;\/p&gt;\n&lt;p&gt;2016: Doutorado em Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), com est&amp;aacute;gio de doutorado na Universidade Paris 1 Panth&amp;eacute;on-Sorbonne, percurso em Cr&amp;iacute;tica de Arte, bolsa PNDS CAPES.&lt;\/p&gt;\n&lt;p&gt;2018: P&amp;oacute;s-Doutorado em Hist&amp;oacute;ria da Arte pela Universidade Federal de S&amp;atilde;o Paulo (UNIFESP)&lt;\/p&gt;&quot;,&quot;images&quot;:[],&quot;primary_image&quot;:null,&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:true},&quot;periods&quot;:[],&quot;genders&quot;:[],&quot;cities&quot;:[],&quot;awards&quot;:[],&quot;links&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/lattes.cnpq.br\/6838453885637422\&quot;&gt;http:\/\/lattes.cnpq.br\/6838453885637422&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-08-04T13:31:59.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:03:33.000000Z&quot;}],&quot;content&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;A presen&amp;ccedil;a de nomes de mulheres na hist&amp;oacute;ria da arte foi &amp;mdash; por muito tempo &amp;mdash; restrita por quest&amp;otilde;es sociais e pol&amp;iacute;ticas. Hoje, aos poucos, as artistas que foram invisibilizadas no passado s&amp;atilde;o encontradas pelas novas narrativas hist&amp;oacute;ricas e pela cr&amp;iacute;tica feminista. Aprendemos com o livro &lt;em&gt;O Segundo Sexo&lt;\/em&gt; de Simone de Beauvoir, publicado em 1949, que ser mulher &amp;eacute; uma condi&amp;ccedil;&amp;atilde;o estruturada por uma tradi&amp;ccedil;&amp;atilde;o sociocultural. Nesta perspectiva, entende-se que mulheres s&amp;atilde;o educadas para se tornarem &amp;ldquo;mulheres&amp;rdquo;. S&amp;atilde;o, portanto, ensinadas a ocupar alguns espa&amp;ccedil;os e outros n&amp;atilde;o. O espa&amp;ccedil;o dom&amp;eacute;stico &amp;mdash; por muito tempo &amp;mdash; foi reservado &amp;agrave;s mulheres, sempre dedicadas quase exclusivamente ao lar e &amp;agrave; fam&amp;iacute;lia. Sabe-se que Maria do Sant&amp;iacute;ssimo (1890-1974) foi uma mulher que hoje &amp;eacute; representada por suas obras no acervo da Pinacoteca Potiguar. Ela extraiu cor de materiais nada convencionais para a pintura, como tintas &amp;agrave; base de anilina. Por leves tra&amp;ccedil;os e suave gestualidade, Maria pintou galos, galinhas, pav&amp;otilde;es, flores, casas e outras figuras do seu cotidiano. Muitos concordaram que ela encontrou o principal motivo do seu processo de cria&amp;ccedil;&amp;atilde;o observando o seu quintal. Todavia, considerando uma perspectiva mais cr&amp;iacute;tica, podemos sugerir que a condi&amp;ccedil;&amp;atilde;o de ser mulher a impediu de ver mais que os limites do&lt;br&gt;seu espa&amp;ccedil;o dom&amp;eacute;stico.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Um fato curioso da hist&amp;oacute;ria de Maria do Sant&amp;iacute;ssimo &amp;eacute; que ela come&amp;ccedil;ou a pintar ainda jovem. Mas, algo ocorreu que a impediu de pintar por muito tempo. Quando voltou &amp;agrave; pr&amp;aacute;tica art&amp;iacute;stica j&amp;aacute; era idosa, tinha 72 anos. Os gloriosos anos do reconhecimento da arte produzida por Maria coincidem com a primeira d&amp;eacute;cada da ditadura militar (1964-1974), um per&amp;iacute;odo da nossa hist&amp;oacute;ria tamb&amp;eacute;m marcado pelo incentivo estatal ao fortalecimento do mercado de arte popular e da forma&amp;ccedil;&amp;atilde;o de cole&amp;ccedil;&amp;otilde;es desse g&amp;ecirc;nero em acervos p&amp;uacute;blicos. Entendia-se na &amp;eacute;poca que o(a) artista &amp;ldquo;ing&amp;ecirc;nuo(a)&amp;rdquo; produz uma arte ligada &amp;agrave; identidade do povo brasileiro. Vale observar que essa pauta serviu ao ide&amp;aacute;rio nacional-popular do governo militar. Contudo, devemos nos perguntar se a compreens&amp;atilde;o daquela &amp;eacute;poca ainda &amp;eacute; v&amp;aacute;lida para uma leitura atualizada da obra de Maria do Sant&amp;iacute;ssimo.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Considerada &amp;ldquo;arte ing&amp;ecirc;nua&amp;rdquo; &amp;mdash; por muito tempo, hoje, a pintura de Maria do Sant&amp;iacute;ssimo pode se libertar de adjetivos coloniais e hier&amp;aacute;rquicos. Suas pinturas s&amp;atilde;o graciosas e merecem ser celebradas, mas n&amp;atilde;o s&amp;atilde;o fruto da ingenuidade, s&amp;atilde;o express&amp;otilde;es pl&amp;aacute;sticas que revelam a condi&amp;ccedil;&amp;atilde;o de uma mulher seridoense que viveu um contexto s&amp;oacute;cio-pol&amp;iacute;tico conservador. Muitos podem pensar que a obra de Maria &amp;eacute; apenas sobre pav&amp;otilde;es e flores, por&amp;eacute;m, &amp;eacute; muito mais sobre o direito de ver da mulher e o que isso&lt;br&gt;nos diz sobre a emancipa&amp;ccedil;&amp;atilde;o feminina.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Texto publicado originalmente em: &lt;a href=\&quot;https:\/\/publicacoes.even3.com.br\/book\/escritos-e-reescritos-textos-reunidos-5530985\&quot; target=\&quot;New Tab\&quot;&gt;https:\/\/publicacoes.even3.com.br\/book\/escritos-e-reescritos-textos-reunidos-5530985&lt;\/a&gt;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Imagem: &lt;em&gt;Galos, s.d. &lt;\/em&gt;Maria Antonia do Santiss&amp;iacute;mo (S&amp;atilde;o Vicente, Rio Grande do Norte, 1890 - idem 1974). Pintora. Come&amp;ccedil;a a pintar em 1899, em sua cidade natal, utilizando toscos materiais, como pincel de palito de coqueiro, anilinas e papel de embrulho ou pautado. Interrompe sua atividade art&amp;iacute;stica em 1914. Dispon&amp;iacute;vel em: &lt;a href=\&quot;https:\/\/enciclopedia.itaucultural.org.br\/pessoas\/7310-maria-do-santissimo\&quot; target=\&quot;New Tab\&quot;&gt;https:\/\/enciclopedia.itaucultural.org.br\/pessoas\/7310-maria-do-santissimo&lt;\/a&gt; (acesso: 05\/08\/2026).&amp;nbsp;&lt;\/p&gt;&quot;,&quot;images&quot;:[{&quot;uuid&quot;:&quot;71ac521b-7a87-4e91-9460-5b85eed625d1&quot;,&quot;name&quot;:&quot;QItKB5VGM4aWE4gB2xjlm8p8HQW1A8SAeeJtSGRN.jpg&quot;,&quot;original_name&quot;:&quot;dhzy225x5393fpwynnly0atinifa.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/Review\/3716ad1b-f17e-43f0-a3a4-da60b30ef023\/general\/QItKB5VGM4aWE4gB2xjlm8p8HQW1A8SAeeJtSGRN.jpg&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:59906,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-08-05T15:24:04.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T15:24:04.000000Z&quot;}],&quot;primary_image&quot;:{&quot;uuid&quot;:&quot;71ac521b-7a87-4e91-9460-5b85eed625d1&quot;,&quot;name&quot;:&quot;QItKB5VGM4aWE4gB2xjlm8p8HQW1A8SAeeJtSGRN.jpg&quot;,&quot;original_name&quot;:&quot;dhzy225x5393fpwynnly0atinifa.jpg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/Review\/3716ad1b-f17e-43f0-a3a4-da60b30ef023\/general\/QItKB5VGM4aWE4gB2xjlm8p8HQW1A8SAeeJtSGRN.jpg&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:59906,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-08-05T15:24:04.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T15:24:04.000000Z&quot;},&quot;content_images&quot;:[],&quot;sources&quot;:[{&quot;id&quot;:1,&quot;uuid&quot;:&quot;a9e3dbe4-45d1-4773-9e39-18a5112ab015&quot;,&quot;slug&quot;:&quot;maria-do-santissimo&quot;,&quot;title&quot;:&quot;MARIA do Sant\u00edssimo.&quot;,&quot;content&quot;:&quot;&lt;p&gt;In: ENCICLOP&amp;Eacute;DIA Ita&amp;uacute; Cultural de Arte e Cultura Brasileira. S&amp;atilde;o Paulo: Ita&amp;uacute; Cultural, 2026. Dispon&amp;iacute;vel em:&amp;nbsp;&lt;a href=\&quot;http:\/\/enciclopedia.itaucultural.org.br\/pessoas\/7310-maria-do-santissimo\&quot;&gt;http:\/\/enciclopedia.itaucultural.org.br\/pessoas\/7310-maria-do-santissimo&lt;\/a&gt;. Acesso em: 05 de agosto de 2026. Verbete da Enciclop&amp;eacute;dia. &lt;br&gt;ISBN: 978-85-7979-060-7&lt;\/p&gt;&quot;,&quot;file&quot;:null,&quot;created_at&quot;:&quot;2026-08-05T15:28:16.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T15:28:50.000000Z&quot;}],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:false},&quot;categories&quot;:[{&quot;uuid&quot;:&quot;558160e4-cbc0-4893-9988-6b1e37729bb3&quot;,&quot;name&quot;:&quot;Arte popular&quot;,&quot;slug&quot;:&quot;arte-popular&quot;,&quot;created_at&quot;:&quot;2026-08-05T15:29:31.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T15:29:31.000000Z&quot;}],&quot;created_at&quot;:&quot;2026-08-05T15:15:39.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T15:26:51.000000Z&quot;}]},&quot;historyArticles&quot;:{&quot;data&quot;:[{&quot;uuid&quot;:&quot;5de5bcc2-b482-451a-85da-5894670dac5f&quot;,&quot;slug&quot;:&quot;tempo-do-bom-jardim&quot;,&quot;title&quot;:&quot;Tempo do bom jardim&quot;,&quot;date&quot;:null,&quot;authors&quot;:[{&quot;uuid&quot;:&quot;73e9ff73-fe55-4a79-8f1a-00d38d92c8a0&quot;,&quot;slug&quot;:&quot;fabiola-alves&quot;,&quot;name&quot;:&quot;Fab\u00edola Alves&quot;,&quot;date_of_birth&quot;:&quot;1986-02-14&quot;,&quot;date_of_death&quot;:null,&quot;content&quot;:&quot;&lt;p&gt;Natural de Gua&amp;iacute;ra (PR), vive no Nordeste brasileiro desde 2018 e atualmente reside em Natal (RN).&amp;nbsp; Desde 2020 &amp;eacute; professora da Universidade Federal do Rio Grande do Norte (DEART-UFRN). &amp;Eacute; membro a Associa&amp;ccedil;&amp;atilde;o Brasileira de Cr&amp;iacute;ticos de Arte (ABCA) e coordenadora do Programa de P&amp;oacute;s-gradua&amp;ccedil;&amp;atilde;o em Artes Visuais da (PPGAV-UFRN).&amp;nbsp;&lt;\/p&gt;&quot;,&quot;chronology&quot;:&quot;&lt;p&gt;2008: Licenciatura plena em Educa&amp;ccedil;&amp;atilde;o Art&amp;iacute;stica - Desenho pela Universidade Federal do Paran&amp;aacute; (UFPR).&lt;\/p&gt;\n&lt;p&gt;2013: Mestrado Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), bolsa FAPESP.&lt;\/p&gt;\n&lt;p&gt;2016: Doutorado em Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), com est&amp;aacute;gio de doutorado na Universidade Paris 1 Panth&amp;eacute;on-Sorbonne, percurso em Cr&amp;iacute;tica de Arte, bolsa PNDS CAPES.&lt;\/p&gt;\n&lt;p&gt;2018: P&amp;oacute;s-Doutorado em Hist&amp;oacute;ria da Arte pela Universidade Federal de S&amp;atilde;o Paulo (UNIFESP)&lt;\/p&gt;&quot;,&quot;images&quot;:[],&quot;primary_image&quot;:null,&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:true},&quot;periods&quot;:[],&quot;genders&quot;:[],&quot;cities&quot;:[],&quot;awards&quot;:[],&quot;links&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/lattes.cnpq.br\/6838453885637422\&quot;&gt;http:\/\/lattes.cnpq.br\/6838453885637422&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-08-04T13:31:59.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:03:33.000000Z&quot;}],&quot;content&quot;:&quot;&lt;p&gt;Um coment&amp;aacute;rio...&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;O trabalho de Regina Johas (Figura 5) &amp;eacute; uma das obras apresentadas na exposi&amp;ccedil;&amp;atilde;o que, justamente, conecta essas temporalidades. A obra Bom Jardim (2017) relembra a passagem do modernista M&amp;aacute;rio de Andrade no Rio Grande do Norte e suas incurs&amp;otilde;es no Nordeste brasileiro em busca dos brasis. O trabalho de Regina Johas leva o espectador a tr&amp;ecirc;s tempos distintos no reencontro com as ru&amp;iacute;nas da casa que hospedou Andrade. O primeiro tempo &amp;eacute; a origem da pr&amp;oacute;pria casa, constru&amp;iacute;da por volta de 1850, com evid&amp;ecirc;ncia, nos tra&amp;ccedil;os da arquitetura, da presen&amp;ccedil;a portuguesa na regi&amp;atilde;o &amp;ndash;&amp;nbsp; a mem&amp;oacute;ria colonial que atravessa o tempo presente.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;O entre, ou o segundo tempo, remete ao ano de 1928, quando o escritor modernista visita a Fazenda Bom Jardim, em Goianinha (RN), revelando o interesse etnogr&amp;aacute;fico de Andrade para o interior do pa&amp;iacute;s, com o seu olhar em dire&amp;ccedil;&amp;atilde;o ao Nordeste e ao Norte, como tamb&amp;eacute;m prop&amp;ocirc;s Em&amp;iacute;lio Contente em seu trabalho na mostra. O terceiro tempo, decisivo no jogo, &amp;eacute; o tempo de agora, &amp;eacute; o casar&amp;atilde;o em estado avan&amp;ccedil;ado de deteriora&amp;ccedil;&amp;atilde;o, &amp;eacute; a sua hist&amp;oacute;ria que desaparece materialmente com o passar dos anos e a falta de pol&amp;iacute;ticas de preserva&amp;ccedil;&amp;atilde;o patrimonial. O tempo de agora &amp;eacute; uma exist&amp;ecirc;ncia que reivindica uma fresta de sobreviv&amp;ecirc;ncia, n&amp;atilde;o fosse a nota po&amp;eacute;tica de Regina Johas que recupera um tra&amp;ccedil;o de mem&amp;oacute;ria dessa casa que une e entrela&amp;ccedil;a temporalidades.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;ALVES, Fab&amp;iacute;ola Cristina (org.). Pesquisa e cr&amp;iacute;tica em artes visuais: conex&amp;otilde;es a partir do Rio Grande do Norte, Para&amp;iacute;ba e Pernambuco. Natal: EDUFRN, 2024. Dispon&amp;iacute;vel em:&amp;nbsp;&lt;a href=\&quot;https:\/\/repositorio.ufrn.br\/items\/bc412621-7177-4208-875f-ae18540e548a\&quot; target=\&quot;New Tab\&quot;&gt;https:\/\/repositorio.ufrn.br\/items\/bc412621-7177-4208-875f-ae18540e548a&lt;\/a&gt;&lt;\/p&gt;\n&lt;p&gt;Imagem: Bom Jardim, Regina Johas, 2017. Fonte:&amp;nbsp;&lt;a href=\&quot;https:\/\/www.reginajohas.net\/work\/bom-jardim-2017-fotografia\&quot; target=\&quot;New Tab\&quot;&gt;https:\/\/www.reginajohas.net\/work\/bom-jardim-2017-fotografia&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;images&quot;:[{&quot;uuid&quot;:&quot;abe40b44-44fc-4191-b525-a7ebc5ce9fb7&quot;,&quot;name&quot;:&quot;Zd5anqLbD2LRfoclK5g9hJX1WAllAeFahyZcKio4.png&quot;,&quot;original_name&quot;:&quot;Captura de tela de 2026-10-14 07-58-40.png&quot;,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/HistoryArticle\/5de5bcc2-b482-451a-85da-5894670dac5f\/general\/Zd5anqLbD2LRfoclK5g9hJX1WAllAeFahyZcKio4.png&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:1658862,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-10-14T11:02:12.000000Z&quot;, \/f499dce1-3abb-4507-a85c-76b4acfa2231\/general\/LZHvScjxXW3VWlyItbqJDAX47Vuf8AfhujOS4ybY.jpg&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:93909,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-08-04T12:31:35.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-04T12:31:42.000000Z&quot;},&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;start_date&quot;:&quot;antes da invas\u00e3o&quot;,&quot;end_date&quot;:&quot;1500&quot;,&quot;created_at&quot;:&quot;2026-08-04T11:17:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-06T20:43:41.000000Z&quot;}],&quot;links&quot;:&quot;&lt;p&gt;Imagem: &lt;a href=\&quot;https:\/\/acervus.ufrn.br\/acervus-publico\/museu-camara-cascudo\/acervo\/005332\&quot;&gt;https:\/\/acervus.ufrn.br\/acervus-publico\/museu-camara-cascudo\/acervo\/005332&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-08-05T16:35:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T16:48:04.000000Z&quot;},{&quot;uuid&quot;:&quot;17a3951b-f3fa-4fa8-bc6a-04c8a350b2ff&quot;,&quot;slug&quot;:&quot;monumento-a-independencia-uma-obra-de-bibiano-silva-em-natal-rn&quot;,&quot;title&quot;:&quot;Monumento \u00e0 Independ\u00eancia: uma obra de Bibiano Silva em Natal (RN)&quot;,&quot;date&quot;:null,&quot;authors&quot;:[{&quot;uuid&quot;:&quot;73e9ff73-fe55-4a79-8f1a-00d38d92c8a0&quot;,&quot;slug&quot;:&quot;fabiola-alves&quot;,&quot;name&quot;:&quot;Fab\u00edola Alves&quot;,&quot;date_of_birth&quot;:&quot;1986-02-14&quot;,&quot;date_of_death&quot;:null,&quot;content&quot;:&quot;&lt;p&gt;Natural de Gua&amp;iacute;ra (PR), vive no Nordeste brasileiro desde 2018 e atualmente reside em Natal (RN).&amp;nbsp; Desde 2020 &amp;eacute; professora da Universidade Federal do Rio Grande do Norte (DEART-UFRN). &amp;Eacute; membro a Associa&amp;ccedil;&amp;atilde;o Brasileira de Cr&amp;iacute;ticos de Arte (ABCA) e coordenadora do Programa de P&amp;oacute;s-gradua&amp;ccedil;&amp;atilde;o em Artes Visuais da (PPGAV-UFRN).&amp;nbsp;&lt;\/p&gt;&quot;,&quot;chronology&quot;:&quot;&lt;p&gt;2008: Licenciatura plena em Educa&amp;ccedil;&amp;atilde;o Art&amp;iacute;stica - Desenho pela Universidade Federal do Paran&amp;aacute; (UFPR).&lt;\/p&gt;\n&lt;p&gt;2013: Mestrado Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), bolsa FAPESP.&lt;\/p&gt;\n&lt;p&gt;2016: Doutorado em Artes pela Universidade Estadual Paulista J&amp;uacute;lio de Mesquita Filho (UNESP), com est&amp;aacute;gio de doutorado na Universidade Paris 1 Panth&amp;eacute;on-Sorbonne, percurso em Cr&amp;iacute;tica de Arte, bolsa PNDS CAPES.&lt;\/p&gt;\n&lt;p&gt;2018: P&amp;oacute;s-Doutorado em Hist&amp;oacute;ria da Arte pela Universidade Federal de S&amp;atilde;o Paulo (UNIFESP)&lt;\/p&gt;&quot;,&quot;images&quot;:[],&quot;primary_image&quot;:null,&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:true},&quot;periods&quot;:[],&quot;genders&quot;:[],&quot;cities&quot;:[],&quot;awards&quot;:[],&quot;links&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/lattes.cnpq.br\/6838453885637422\&quot;&gt;http:\/\/lattes.cnpq.br\/6838453885637422&lt;\/a&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-08-04T13:31:59.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:03:33.000000Z&quot;}],&quot;content&quot;:&quot;&lt;p class=\&quot;MsoNormal\&quot; style=\&quot;line-height: 150%; margin: 0cm 42.55pt 12pt 2cm; text-align: justify;\&quot;&gt;&lt;strong&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;O 1&amp;ordm; Centen&amp;aacute;rio da Independ&amp;ecirc;ncia e contexto norte-rio-grandense&lt;\/span&gt;&lt;\/strong&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p class=\&quot;MsoNormal\&quot; style=\&quot;line-height: 150%; margin: 0cm 42.55pt 12pt 2cm; text-align: justify;\&quot;&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;A Independ&amp;ecirc;ncia do Brasil ocorreu no ano de 1822, e o dia 7 de setembro foi estabelecido como o dia do grito &amp;ldquo;Independ&amp;ecirc;ncia ou Morte&amp;rdquo; proclamado por Dom Pedro I, quando foi institu&amp;iacute;do o Brasil Imp&amp;eacute;rio. Sabe-se que a estrutura e os processos pol&amp;iacute;ticos que provocaram a separa&amp;ccedil;&amp;atilde;o do pa&amp;iacute;s com rela&amp;ccedil;&amp;atilde;o a Portugal s&amp;atilde;o mais complexos. &lt;\/span&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;Contudo, neste estudo,&lt;\/span&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt; destaca-se a elei&amp;ccedil;&amp;atilde;o dessa data como marco que celebra esse evento da hist&amp;oacute;ria nacional. No primeiro centen&amp;aacute;rio da Independ&amp;ecirc;ncia do Brasil, o Imp&amp;eacute;rio j&amp;aacute; era passado e o pa&amp;iacute;s vivia a experi&amp;ecirc;ncia da Rep&amp;uacute;blica. Doravante, foi dentro das inten&amp;ccedil;&amp;otilde;es do novo regime que as comemora&amp;ccedil;&amp;otilde;es do centen&amp;aacute;rio foram concedidas. &lt;\/span&gt;&lt;\/p&gt;\n&lt;p class=\&quot;MsoNormal\&quot; style=\&quot;line-height: 150%; margin: 0cm 42.55pt 12pt 2cm; text-align: justify;\&quot;&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;Continua&amp;nbsp;&lt;\/span&gt;&lt;span style=\&quot;font-size: 11.0pt; line-height: 150%; font-family: &#039;Arial&#039;,sans-serif;\&quot;&gt;em: &lt;a href=\&quot;http:\/\/www.dezenovevinte.net\/artistas\/fca_bibiano.htm\&quot; target=\&quot;New Tab\&quot;&gt;http:\/\/www.dezenovevinte.net\/artistas\/fca_bibiano.htm&lt;\/a&gt;&amp;nbsp;&lt;\/span 6-01-01T00:00:00.000000Z&quot;,&quot;authors&quot;:[{&quot;uuid&quot;:&quot;f64bd77f-b1b2-462f-a7e4-85d321e056f0&quot;,&quot;slug&quot;:&quot;mariana-do-vale&quot;,&quot;name&quot;:&quot;Mariana do Vale&quot;,&quot;date_of_birth&quot;:null,&quot;date_of_death&quot;:null,&quot;content&quot;:&quot;&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;letter-spacing: normal;\&quot;&gt;Mariana do Vale &amp;eacute; artista visual e se dedica &amp;agrave; produ&amp;ccedil;&amp;atilde;o art&amp;iacute;stica investigando temas como intimidade, pele, corpo e espa&amp;ccedil;o, tendo a fotografia, o v&amp;iacute;deo e a performance como principais suportes.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;letter-spacing: normal;\&quot;&gt;Doutora em Arte Contempor&amp;acirc;nea pelo Col&amp;eacute;gio das Artes da Universidade de Coimbra e mestra em Artes Visuais pela Escola de Belas Artes da UFRJ. Participou do programa Imers&amp;otilde;es Po&amp;eacute;ticas da Escola sem S&amp;iacute;tio em 2021, do Summer Residency da SVA em Nova York, em 2013 e realizou o Master Internacional em Fotografia da Escola EFTI, em Madri em 2009. \u200b&lt;\/span&gt;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;letter-spacing: normal;\&quot;&gt;Em 2022, participou da expo coletiva Viva Brasil, em Coimbra e em 2021, participou da expo virtual Cataploft. Em 2019 participou das coletivas Motel Coimbra e Ateli&amp;ecirc; Aberto em Coimbra\/PT. Em 2018 participou do evento Flex&amp;otilde;es Perform&amp;aacute;ticas, no CCBB\/SP e realizou a exposi&amp;ccedil;&amp;atilde;o individual \&quot;Pactos de Intimidade\&quot;, no Rio de Janeiro. Em 2017, realizou a exposi&amp;ccedil;&amp;atilde;o individual \&quot;Duna: a busca de um si a que pertencer\&quot; no SESC\/RN. Participou ainda das coletivas &lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;font-style: italic;\&quot;&gt;Disculpe las Mol&amp;eacute;stias&lt;\/span&gt; [Cidade do M&amp;eacute;xico, M&amp;eacute;xico, 2015]; &lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;font-style: italic;\&quot;&gt;Elas&lt;\/span&gt; [Natal, Brasil, 2014]; &lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;font-style: italic;\&quot;&gt;Open Studios and Exhibition&lt;\/span&gt; [Nova York, EUA, 2013]; &lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;font-style: italic;\&quot;&gt;El ba&amp;ntilde;o, la fotograf&amp;iacute;a contempor&amp;aacute;nea entre lo publico y lo privado&lt;\/span&gt; [San Jos&amp;eacute;, Costa Rica, 2012] e do &lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;font-style: italic;\&quot;&gt;Photo Espa&amp;ntilde;a&lt;\/span&gt; [Madri, Espanha, 2009].&lt;\/span&gt;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p class=\&quot;font_8 wixui-rich-text__text\&quot; style=\&quot;line-height: 1.2em; text-align: justify; font-size: 15px;\&quot;&gt;&lt;span class=\&quot;wixui-rich-text__text\&quot; style=\&quot;letter-spacing: normal;\&quot;&gt;&amp;Eacute; professora no Departamento de Artes da UFRN e mant&amp;eacute;m em Natal o Duas Est&amp;uacute;dio: escola de artes, produtora cultural e galeria de arte.&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;chronology&quot;:null,&quot;images&quot;:[],&quot;primary_image&quot;:null,&quot;content_images&quot;:[],&quot;sources&quot;:[],&quot;pivot&quot;:{&quot;activity&quot;:null,&quot;is_author&quot;:true},&quot;periods&quot;:[],&quot;genders&quot;:[],&quot;cities&quot;:[],&quot;awards&quot;:[],&quot;links&quot;:null,&quot;created_at&quot;:&quot;2026-08-04T13:35:26.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:16:11.000000Z&quot;}],&quot;content&quot;:null,&quot;images&quot;:[{&quot;uuid&quot;:&quot;c77f5931-f46a-4413-a72b-e6b98e340cee&quot;,&quot;name&quot;:&quot;2ta1Wwwbg8OtwawN9e4pTLQFmANZWCQq6iAwNmQw.jpg&quot;,&quot;original_name&quot;:&quot;WhatsApp Image 2026-08-05 at 14.13.21.jpeg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/Artwork\/a235749b-348b-4870-964c-d475dd7a3d4d\/general\/2ta1Wwwbg8OtwawN9e4pTLQFmANZWCQq6iAwNmQw.jpg&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:157060,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-08-05T17:13:48.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:13:48.000000Z&quot;}],&quot;primary_image&quot;:{&quot;uuid&quot;:&quot;c77f5931-f46a-4413-a72b-e6b98e340cee&quot;,&quot;name&quot;:&quot;2ta1Wwwbg8OtwawN9e4pTLQFmANZWCQq6iAwNmQw.jpg&quot;,&quot;original_name&quot;:&quot;WhatsApp Image 2026-08-05 at 14.13.21.jpeg&quot;,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;path&quot;:&quot;http:\/\/shaula.ufrn.br:80\/storage\/files\/Artwork\/a235749b-348b-4870-964c-d475dd7a3d4d\/general\/2ta1Wwwbg8OtwawN9e4pTLQFmANZWCQq6iAwNmQw.jpg&quot;,&quot;collection&quot;:&quot;general&quot;,&quot;size&quot;:157060,&quot;is_primary&quot;:1,&quot;created_at&quot;:&quot;2026-08-05T17:13:48.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-05T17:13:48.000000Z&quot;},&quot;content_images&quot;:[],&quot;s
