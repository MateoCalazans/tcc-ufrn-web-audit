				$("#espaco_vertical_grande_esquerdo").css("margin-right", "15px");
				$(".espaco_vertical_grande_transparente").css("margin-right", "15px");
				$(".espaco_vertical_pequeno_esquerdo").css("margin-right", "15px");
				$(".espaco_vertical_pequeno_direito").css("margin-right", "15px");

				var ajusteImagemQuadrantePequenoLeft = imagemQuadrantePequeno / (110 / -55);

				$(".img_quadrante_pequeno").css("margin-top", ajusteImagemQuadrantePequenoTop);
				var ajusteImagemQuadranteHorizontalTop = imagemQuadranteGrande / (160 / -80);
				var ajusteImagemQuadranteHorizontalLeft = imagemQuadranteGrande / (160 / 165);
				$(".img_quadrante_baixo").css("width", imagemQuadranteGrande);

				var canvasHeight = canvasWidth / 1.692307692307692;

				$("#canvas_espaco").css("height", canvasHeight);
				var quadranteGrandeWidth = (canvasWidth - distanciaQuadrantes * 4) / 5;
				var quadranteGrandeHeight = quadranteGrandeWidth * (561.75 / 228);
				$("#espaco_vertical_grande_meio").css("width", quadranteGrandeWidth);
				$("#espaco_vertical_grande_meio").css("height", quadranteGrandeHeight);
				$("#espaco_vertical_grande_esquerdo").css("width", quadranteGrandeWidth);
				$("#espaco_vertical_grande_esquerdo").css("height", quadranteGrandeHeight);

				var marginTopPequeno = quadranteGrandeWidth / (260 / 50);
				$(".espaco_vertical_pequeno_direito").css("margin-top", marginTopPequeno);

				var quadranteHorizontalWidth = (canvasWidth - distanciaQuadrantes) / 2;
	    		var quadranteHorizontalHeight = quadranteHorizontalWidth / (637.5 / 173.25);
	    		$(".espaco_horizontal").css("width", quadranteHorizontalWidth);
				$(".espaco_horizontal").css("height", quadranteHorizontalHeight);
				var fontCanvasGrande = quadranteGrandeWidth / (260 / 25);
				var fontCanvasPequeno = quadranteGrandeWidth / (260 / 21);
				var marginFontHorizontal = quadranteHorizontalWidth / (730 / 40)
				$(".string_canvas_grande").css("font-size", fontCanvasGrande);
				$(".string_canvas_pequeno").css("font-size", fontCanvasPequeno);
				$(".string_canvas_horizontal").css("font-size", fontCanvasGrande);
				$(".string_canvas_horizontal").css("margin-left", marginFontHorizontal);
				var imagemQuadranteGrande = quadranteGrandeWidth / (260 / 160);
				var ajusteImagemQuadranteGrande = imagemQuadranteGrande / -2;
				$(".img_quadrante_grande_lateral").css("width", imagemQuadranteGrande);
				$(".img_quadrante_grande_lateral").css("height", imagemQuadranteGrande);

				$(".img_quadrante_grande_lateral").css("margin-top", ajusteImagemQuadranteGrande);
				var imagemQuadrantePequeno = quadranteGrandeWidth / (260 / 110);
				var ajusteImagemQuadrantePequenoTop = imagemQuadrantePequeno / (110 / -17);
				var ajusteImagemQuadrantePequenoLeft = imagemQuadrantePequeno / (110 / -55);
				$(".img_quadrante_pequeno").css("width", imagemQuadrantePequeno);

				$(".img_quadrante_pequeno").css("margin-top", ajusteImagemQuadrantePequenoTop);
				var ajusteImagemQuadranteHorizontalTop = imagemQuadranteGrande / (160 / -80);
				var ajusteImagemQuadranteHorizontalLeft = imagemQuadranteGrande / (160 / 165);
				$(".img_quadrante_baixo").css("width", imagemQuadranteGrande);
				$(".img_quadrante_baixo").css("height", imagemQuadranteGrande);
				$(".img_quadrante_baixo").css("margin-left", ajusteImagemQuadranteHorizontalLeft);
				$(".img_quadrante_baixo").css("margin-top", ajusteImagemQuadranteHorizontalTop);
			}
		}
		$(window).resize(function() {
	  		transformScreen();
		});

			transformScreen();
		});
